name: compile

on:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # https://stackoverflow.com/a/77140873
      - name: Set up C/C++
        shell: cmd
        run: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat x64

      - name: Compile code
        shell: cmd
        run: cl /ZI /D _UNICODE /D UNICODE main.c User32.lib Gdi32.lib Shlwapi.lib Shell32.lib Pathcch.lib /Fe:screenshot.exe
